/* ==================== Web Audio API 音效合成器 (含自動解鎖) ==================== */
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.bgmTimer = null;
        this.isMuted = false;
    }
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
    playTone(freq, duration, type = "square", gainVal = 0.1) {
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    }
    playPickup() {
        this.init();
        this.playTone(523.25, 0.08, "sine", 0.15);
        setTimeout(() => this.playTone(659.25, 0.08, "sine", 0.15), 80);
        setTimeout(() => this.playTone(783.99, 0.15, "sine", 0.15), 160);
    }
    playFail() {
        this.init();
        this.playTone(300, 0.15, "sawtooth", 0.2);
        setTimeout(() => this.playTone(220, 0.15, "sawtooth", 0.2), 150);
        setTimeout(() => this.playTone(150, 0.3, "sawtooth", 0.2), 300);
    }
    playWin() {
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 0.15, "triangle", 0.2), i * 120);
        });
    }
    startBGM() {
        this.init();
        if (this.bgmTimer) return;
        const melody = [261, 329, 392, 329, 293, 349, 440, 349, 329, 392, 523, 392];
        let idx = 0;
        this.bgmTimer = setInterval(() => {
            if (!this.isMuted) {
                this.playTone(melody[idx], 0.2, "triangle", 0.03);
                idx = (idx + 1) % melody.length;
            }
        }, 400);
    }
}

class Bunny {
    constructor() {
        this.x = 1.5 * TILE_SIZE;

        this.speed = 3.2;
        this.vx = 0;
        this.vy = 0;
        this.hopFrame = 0;
    }
    update() {
        if (this.vx !== 0 || this.vy !== 0) {
            let nextX = this.x + this.vx * this.speed;
            let nextY = this.y + this.vy * this.speed;

            if (!checkWallCollision(nextX, this.y, 14)) this.x = nextX;
            if (!checkWallCollision(this.x, nextY, 14)) this.y = nextY;

            this.hopFrame += 0.25;
        } else {
            this.hopFrame = 0;

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.ellipse(0, 14 - hopY*0.5, 12, 6, 0, 0, Math.PI * 2);
