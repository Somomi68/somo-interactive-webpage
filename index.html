<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 0 25px rgba(0,0,0,0.85);
        }

        /* 抬頭顯示進度 HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #333;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 10;
        }

        /* 右下角極簡 4 方向鍵 */
        #dpad {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 130px;
            height: 130px;
            z-index: 10;
        }

        .d-btn {
            position: absolute;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.88);
            border: 3px solid #3c3c3c;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: manipulation;
            cursor: pointer;
        }

        .d-btn:active {
            background: #ffcc00;
            transform: scale(0.92);
        }

        #btn-up    { top: 0; left: 44px; }
        #btn-down  { bottom: 0; left: 44px; }
        #btn-left  { top: 44px; left: 0; }
        #btn-right { top: 44px; right: 0; }

        /* 全螢幕覆蓋彈窗 (已解決隱藏阻擋問題) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        /* 視窗卡片 */
        .card {
            background: #fff8eb;
            border: 4px solid #4a3728;
            border-radius: 20px;
            width: 90%;
            max-width: 480px;
            padding: 26px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-height: 90vh;
            overflow-y: auto;
        }

        .card h1 {
            font-size: 22px;
            color: #5a3e2b;
            margin-bottom: 12px;
        }

        .card p {
            font-size: 14px;
            color: #4a4a4a;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 16px;
        }

        .rules-box {
            background: #f0e6d2;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13px;
            color: #333;
            margin-bottom: 18px;
            text-align: left;
        }

        .btn-start {
            background: #ffaa00;
            color: #fff;
            border: 3px solid #c88000;
            border-radius: 12px;
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #c88000;
            transition: all 0.1s;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #c88000;
        }

        /* RPG 對話框 */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: #222;
            border: 4px solid #fff;
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            font-size: 16px;
            line-height: 1.5;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            z-index: 50;
            display: none;
        }

        /* 拍立得彈窗 */
        .polaroid-card {
            background: #fff;
            padding: 16px 16px 24px 16px;
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 380px;
            width: 85%;
        }

        .polaroid-media {
            width: 100%;
            height: 240px;
            background: #eee;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .polaroid-caption {
            font-size: 15px;
            color: #333;
            font-weight: bold;
        }

        .game-title-banner {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .success-text { color: #27ae60; }
        .fail-text { color: #e74c3c; }
    </style>
</head>

        </div>
    </div>
</div>

/* ==================== Web Audio API 音效合成器 ==================== */
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.bgmTimer = null;
    }
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
    playTone(freq, duration, type = "square", gainVal = 0.1) {
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    }
    playPickup() {
        this.init();
        this.playTone(523.25, 0.08, "sine", 0.15);
        setTimeout(() => this.playTone(659.25, 0.08, "sine", 0.15), 80);
        setTimeout(() => this.playTone(783.99, 0.15, "sine", 0.15), 160);
    }
    playFail() {
        this.init();
        this.playTone(300, 0.15, "sawtooth", 0.2);
        setTimeout(() => this.playTone(220, 0.15, "sawtooth", 0.2), 150);
        setTimeout(() => this.playTone(150, 0.3, "sawtooth", 0.2), 300);
    }
    playWin() {
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 0.15, "triangle", 0.2), i * 120);
        });
    }
    startBGM() {
        this.init();
        if (this.bgmTimer) return;
        const melody = [261, 329, 392, 329, 293, 349, 440, 349, 329, 392, 523, 392];
        let idx = 0;
        this.bgmTimer = setInterval(() => {
            this.playTone(melody[idx], 0.2, "triangle", 0.03);
            idx = (idx + 1) % melody.length;
        }, 400);
    }
}
const audio = new SoundEngine();
