<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰白小兔互動網站 Somo’s Interactive web page</title>
    <style>
        :root {
            --clay-bg: #eef2f5;
            --clay-card: #fff6eb;
            --clay-border: #7c685b;
            --clay-btn: #ffab91;
            --clay-btn-border: #d84315;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-width: 177.78vh;
            max-height: 100vh;
            background-color: var(--clay-bg);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border-radius: 16px;
            overflow: hidden;
        }

        /* 1. 開場頁面 Landing Page */
        #intro-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s;
            padding: 20px;
        }

        .clay-card {
            background: var(--clay-card);
            border: 6px solid var(--clay-border);
            border-radius: 28px;
            padding: 25px 35px;
            box-shadow: 8px 8px 0px #bcaaa4, inset -4px -4px 0px rgba(0,0,0,0.05);
            max-width: 680px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .intro-title {
            font-size: 24px;
            color: #5d4037;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .intro-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 4px 4px 0px #bcaaa4;
            object-fit: cover;
            background-color: #d7ccc8;
            margin-bottom: 8px;
        }

        .intro-date {
            font-size: 14px;
            color: #8d6e63;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .intro-text {
            font-size: 14px;
            color: #4e342e;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .clay-btn {
            background: var(--clay-btn);
            color: #4e342e;
            border: 4px solid var(--clay-btn-border);
            padding: 10px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--clay-btn-border);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .clay-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--clay-btn-border);
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .top-bar {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .scene-indicator {
            background: #fff;
            border: 3px solid #5d4037;
            padding: 6px 18px;
            border-radius: 16px;
            font-weight: bold;
            color: #5d4037;
            box-shadow: 3px 3px 0 #5d4037;
            font-size: 16px;
        }

        .icon-btn {
            background: #ffe082;
            border: 3px solid #ff8f00;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 3px 3px 0 #ff8f00;
            font-size: 20px;
        }

        #door-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 75;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        #door-modal.active { opacity: 1; visibility: visible; }

        .door-card {
            background: #fff6eb;
            border: 5px solid #5d4037;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 6px 6px 0 #5d4037;
        }

        .door-options {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        #polaroid-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        #polaroid-modal.active { opacity: 1; visibility: visible; }

        .polaroid-frame {
            background: #fff;
            padding: 16px 16px 22px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 0 8px #eae6df;
            width: 380px;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(-1.5deg);
            position: relative;
        }

        .media-box {
            width: 100%;
            height: 250px;
            background: #111;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .media-box img, .media-box video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .polaroid-caption {
            margin-top: 14px;
            font-size: 15px;
            color: #3e2723;
            text-align: center;
            font-weight: 600;
            line-height: 1.4;
        }

        .close-btn {
            position: absolute;
            top: -12px; right: -12px;
            background: #ff5252;
            color: #fff;
            border: 3px solid #b71c1c;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .minigame-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 248, 225, 0.96);
            z-index: 80;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s;
            pointer-events: auto;
            padding: 20px;
            text-align: center;
        }

        .minigame-overlay.active { opacity: 1; visibility: visible; }
        .game-title { font-size: 24px; color: #4e342e; margin-bottom: 12px; font-weight: bold; }

        .veggie-options {
            display: flex; gap: 20px; margin-top: 20px;
        }
        .veggie-card {
            background: #fff; border: 4px solid #8d6e63;
            padding: 20px 30px; border-radius: 16px;
            font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 4px 4px 0 #8d6e63;
        }
        .veggie-card:hover { background: #ffe0b2; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="intro-overlay">
        <div class="clay-card">
            <div class="intro-title">灰白小兔互動網站 Somo’s Interactive web page</div>
            <img src="assets/intro_somo.jpg" alt="小比" class="intro-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><circle cx=\'50\' cy=\'50\' r=\'40\' fill=\'%23a0a0a0\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23fff\'>小比</text></svg>'">
            <div class="intro-date">2015.06.08 - 2025.12.27</div>
            <div class="intro-text">歡迎來到小比的互動網站！
小比是一隻擁有灰白柔順毛毛、明亮大眼、美麗長睫毛與滿滿個性的聰明好兔寶。
這裡紀錄了小比的生活點滴，請跟著小比的腳步，穿梭於溫馨房間、戶外海邊與青青草地，解鎖屬於牠的每一段故事。
點擊「開始！」，跟著小比一起漫遊這個充滿回憶與溫暖的小天地吧 ₍ᐢ.ˬ.ᐢ₎✨</div>
            <button class="clay-btn" id="start-btn">開始！</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="scene-indicator" id="scene-name">空間一：室內房間</div>
            <div class="icon-btn" id="bgm-toggle">🎵</div>
        </div>
    </div>

    <div id="door-modal">
        <div class="door-card">
            <h3 style="color:#5d4037; margin-bottom:10px;">🚪 開門去哪裡散步呢？</h3>
            <div class="door-options">
                <button class="clay-btn" id="go-beach-btn">🌊 戶外海邊</button>
                <button class="clay-btn" id="go-meadow-btn">🌿 戶外草地</button>
            </div>
        </div>
    </div>

    <div id="polaroid-modal">
        <div class="polaroid-frame">
            <button class="close-btn" id="close-modal">✕</button>
            <div class="media-box" id="media-container"></div>
            <div class="polaroid-caption" id="modal-caption">照片說明</div>
        </div>
    </div>

    <div class="minigame-overlay" id="minigame-container"></div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const state = {
            currentScene: 'room',
            rabbitPos: { x: 300, y: 350 },
            targetPos: { x: 300, y: 350 },
            isMoving: false,
            actionAnim: null
        };

        const points = {
            marble: { scene: 'room', x: 280, y: 220, label: '大理石板', type: 'click', action: '趴趴',
                media: { type: 'image', path: 'assets/p1', text: '天氣太熱啦！瞬間融化成一張冰涼的兔餅 🧊' }
            },
            bookcase: { scene: 'room', x: 140, y: 160, label: '書櫃', type: 'click',
                media: { type: 'image', path: 'assets/p2', text: '主人說讀完這章有點心吃 ₍ᐢ.ˬ.ᐢ₎' }
            },
            chair: { scene: 'room', x: 480, y: 220, label: '書桌椅', type: 'click', action: '討摸摸',
                media: { type: 'video', path: 'assets/v1', text: '讀書累了嗎？摸摸小比頭頭可以補充 100% 電量喔！' }
            },
            veggieBox: { scene: 'room', x: 520, y: 360, label: '蔬果箱', type: 'game', gameType: 'veggie',
                media: { type: 'image', path: 'assets/p3', text: '名副其實的櫻桃小嘴🍒' }
            },
            hayRack: { scene: 'room', x: 260, y: 280, label: '紅色草碗', type: 'game', gameType: 'hay',
                media: { type: 'image', path: 'assets/p4', text: '平常乾草吃多了，也來點新鮮牧草!' }
            },
            bedding: { scene: 'room', x: 380, y: 410, label: '寢具棉被', type: 'game', gameType: 'bedding',
                media: { type: 'video', path: 'assets/v2', text: '小比不愛布製品，棉被 枕頭 衣服 毛巾都攻擊' }
            },
            litterBox: { scene: 'room', x: 140, y: 280, label: '綠色便盆', type: 'game', gameType: 'litter',
                media: { type: 'image', path: 'assets/p5', text: '我是隻會用便盆的聰明好兔寶' }
            },
            ship: { scene: 'beach', x: 520, y: 220, label: '小比號', type: 'click',
                media: { type: 'image', path: 'assets/p6', text: '小比雖然沒搭過船，但有在沙灘奔跑、吹過海風呦!' }
            },
            ropeway: { scene: 'meadow', x: 320, y: 140, label: '貓空纜車', type: 'click',
                media: { type: 'video', path: 'assets/v3', text: '特別的體驗！飛在空中小兔 Cable Car 🚠' }
            },
            signboard: { scene: 'meadow', x: 460, y: 320, label: '兔子專用草地', type: 'game', gameType: 'binky',
                media: { type: 'video', path: 'assets/v4', text: '我好像跑太快了嘻嘻～✨' }
            }
        };

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            if (canvas) {
                canvas.width = canvas.clientWidth || 800;
                canvas.height = canvas.clientHeight || 450;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawObjects();
            drawSomo();

            if (state.isMoving) {
                const dx = state.targetPos.x - state.rabbitPos.x;
                const dy = state.targetPos.y - state.rabbitPos.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 4) {
                    state.rabbitPos.x = state.targetPos.x;
                    state.rabbitPos.y = state.targetPos.y;
                    state.isMoving = false;
                } else {
                    state.rabbitPos.x += (dx / dist) * 3;
                    state.rabbitPos.y += (dy / dist) * 3;
                }
            }

            requestAnimationFrame(render);
        }

        function drawBackground() {
            const w = canvas.width, h = canvas.height;
            if (state.currentScene === 'room') {
                ctx.fillStyle = '#e8d8c3';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#f7ede2';
                ctx.fillRect(0, 0, w, h * 0.32);
                ctx.strokeStyle = '#bcaaa4';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(0, h * 0.32); ctx.lineTo(w, h * 0.32); ctx.stroke();
            } else if (state.currentScene === 'beach') {
                ctx.fillStyle = '#e0f7fa'; ctx.fillRect(0, 0, w, h * 0.38);
                ctx.fillStyle = '#ffe0b2'; ctx.fillRect(0, h * 0.38, w, h * 0.62);
            } else if (state.currentScene === 'meadow') {
                ctx.fillStyle = '#e1f5fe'; ctx.fillRect(0, 0, w, h * 0.32);
                ctx.fillStyle = '#c8e6c9'; ctx.fillRect(0, h * 0.32, w, h * 0.68);
            }
        }

        function drawObjects() {
            const w = canvas.width, h = canvas.height;

            if (state.currentScene === 'room') {
                ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
                ctx.strokeRect(w * 0.1, h * 0.22, w * 0.32, h * 0.38);

                ctx.fillStyle = 'rgba(129, 199, 132, 0.85)';
                ctx.beginPath();
                ctx.moveTo(w * 0.11, h * 0.24);
                ctx.lineTo(w * 0.22, h * 0.24);
                ctx.lineTo(w * 0.11, h * 0.38);
                ctx.fill();

                ctx.fillStyle = '#9e9e9e';
                ctx.fillRect(w * 0.26, h * 0.24, 75, 45);
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(w * 0.27, h * 0.25, 73, 43);

                ctx.fillStyle = '#b71c1c';
                ctx.fillRect(w * 0.26, h * 0.42, 45, 30);
                ctx.fillStyle = '#d7ccc8'; ctx.fillRect(w * 0.27, h * 0.43, 41, 26);

                ctx.fillStyle = '#8d6e63'; ctx.fillRect(w * 0.68, h * 0.55, 60, 45);
                ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(w * 0.71, h * 0.58, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fdd835'; ctx.beginPath(); ctx.arc(w * 0.74, h * 0.58, 9, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#795548'; ctx.fillRect(w * 0.88, h * 0.12, 55, 110);
                ctx.fillStyle = '#ffe082'; ctx.beginPath(); ctx.arc(w * 0.9, h * 0.24, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#5d4037'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('🚪 開門', w * 0.88, h * 0.1);

            } else if (state.currentScene === 'beach') {
                ctx.fillStyle = '#4fc3f7'; ctx.fillRect(w * 0.4, 0, w * 0.6, h * 0.38);
                ctx.fillStyle = '#d84315';
                ctx.beginPath(); ctx.arc(w * 0.72, h * 0.24, 28, 0, Math.PI); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.fillText('⛵ 小比號', w * 0.68, h * 0.2);

                ctx.fillStyle = '#795548'; ctx.fillRect(w * 0.05, h * 0.5, 45, 90);
                ctx.fillStyle = '#fff'; ctx.fillText('🚪 回房間', w * 0.04, h * 0.47);

            } else if (state.currentScene === 'meadow') {
                ctx.strokeStyle = '#78909c'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, h * 0.15); ctx.lineTo(w, h * 0.15); ctx.stroke();
                ctx.fillStyle = '#ffb74d'; ctx.fillRect(w * 0.42, h * 0.14, 38, 26);
                ctx.fillStyle = '#37474f'; ctx.fillText('🚠 纜車', w * 0.42, h * 0.12);

                ctx.fillStyle = '#6d4c41'; ctx.fillRect(w * 0.68, h * 0.5, 10, 45);
                ctx.fillRect(w * 0.6, h * 0.42, 70, 30);
                ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.fillText('兔子草地 🥕', w * 0.61, h * 0.47);

                ctx.fillStyle = '#795548'; ctx.fillRect(w * 0.05, h * 0.5, 45, 90);
                ctx.fillStyle = '#fff'; ctx.fillText('🚪 回房間', w * 0.04, h * 0.47);
            }

            for (let k in points) {
                const pt = points[k];
                if (pt.scene === state.currentScene) {
                    ctx.fillStyle = '#ff7043';
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#3e2723'; ctx.font = 'bold 12px sans-serif';
                    ctx.fillText(pt.label, pt.x - 22, pt.y - 12);
                }
            }
        }

        function drawSomo() {
            const x = state.rabbitPos.x, y = state.rabbitPos.y;

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath(); ctx.ellipse(x, y + 14, 20, 9, 0, 0, Math.PI * 2); ctx.fill();

            if (state.actionAnim === '趴趴') {
                ctx.fillStyle = '#8d8d8d'; ctx.beginPath(); ctx.ellipse(x, y + 2, 28, 12, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x - 8, y - 2, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#8d8d8d'; ctx.beginPath(); ctx.arc(x - 18, y - 2, 10, 0, Math.PI * 2); ctx.fill();
                return;
            }

            ctx.fillStyle = '#8d8d8d';
            ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.ellipse(x, y - 4, 16, 7, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#8d8d8d';
            ctx.beginPath(); ctx.arc(x, y - 16, 13, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(x - 4, y - 18, 2.8, 0, Math.PI * 2);
            ctx.arc(x + 4, y - 18, 2.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#8d8d8d';
            ctx.beginPath();
            ctx.ellipse(x - 5, y - 28, 3.5, 9, -0.1, 0, Math.PI * 2);
            ctx.ellipse(x + 5, y - 28, 3.5, 9, 0.1, 0, Math.PI * 2);
            ctx.fill();
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (state.currentScene === 'room' && clickX > canvas.width * 0.85 && clickY < canvas.height * 0.4) {
                document.getElementById('door-modal').classList.add('active');
                return;
            }

            if ((state.currentScene === 'beach' || state.currentScene === 'meadow') && clickX < canvas.width * 0.15) {
                state.currentScene = 'room';
                document.getElementById('scene-name').innerText = '空間一：室內房間';
                return;
            }

            let touched = false;
            for (let k in points) {
                const pt = points[k];
                if (pt.scene === state.currentScene) {
                    if (Math.hypot(clickX - pt.x, clickY - pt.y) < 32) {
                        touched = true;
                        state.targetPos = { x: pt.x, y: pt.y + 10 };
                        state.isMoving = true;
                        state.actionAnim = pt.action || null;
                        setTimeout(() => triggerInteraction(pt), 600);
                        break;
                    }
                }
            }

            if (!touched) {
                state.actionAnim = null;
                state.targetPos = { x: clickX, y: clickY };
                state.isMoving = true;
            }
        });

        document.getElementById('go-beach-btn').onclick = () => {
            state.currentScene = 'beach';
            document.getElementById('scene-name').innerText = '空間二：戶外海邊';
            document.getElementById('door-modal').classList.remove('active');
        };
        document.getElementById('go-meadow-btn').onclick = () => {
            state.currentScene = 'meadow';
            document.getElementById('scene-name').innerText = '空間三：戶外草地';
            document.getElementById('door-modal').classList.remove('active');
        };

        function triggerInteraction(pt) {
            if (pt.type === 'click') {
                openPolaroid(pt.media);
            } else if (pt.type === 'game') {
                startMinigame(pt.gameType, pt.media);
            }
        }

        function openPolaroid(media) {
            const container = document.getElementById('media-container');
            container.innerHTML = '';

            if (media.type === 'image') {
                const img = document.createElement('img');
                img.src = `${media.path}.jpg`;
                img.onerror = () => { img.src = `${media.path}.png`; };
                container.appendChild(img);
            } else if (media.type === 'video') {
                const video = document.createElement('video');
                video.src = `${media.path}.mp4`;
                video.controls = true;
                video.autoplay = true;
                container.appendChild(video);
            }

            document.getElementById('modal-caption').innerText = media.text;
            document.getElementById('polaroid-modal').classList.add('active');
        }

        document.getElementById('close-modal').onclick = () => {
            document.getElementById('polaroid-modal').classList.remove('active');
        };

        function startMinigame(gameType, rewardMedia) {
            const container = document.getElementById('minigame-container');
            container.innerHTML = '';
            container.classList.add('active');

            if (gameType === 'veggie') {
                container.innerHTML = `
                    <div class="game-title">🥕 蔬果大對決 (二選一)</div>
                    <p>挑選小比最喜歡吃的蔬果！</p>
                    <div class="veggie-options">
                        <div class="veggie-card" onclick="chooseVeggie(true)">🍒 櫻桃</div>
                        <div class="veggie-card" onclick="chooseVeggie(false)">🍌 香蕉</div>
                    </div>
                `;
                window.chooseVeggie = (isRight) => {
                    container.classList.remove('active');
                    openPolaroid(rewardMedia);
                };

            } else if (gameType === 'hay') {
                container.innerHTML = `
                    <div class="game-title">🌾 牧草吃到飽</div>
                    <p>請選擇小比的年齡階段：</p>
                    <div style="margin:20px; display:flex; gap:15px; justify-content:center;">
                        <button class="clay-btn" onclick="selectAge('baby')">幼兔寶寶</button>
                        <button class="clay-btn" onclick="selectAge('adult')">青壯年小兔</button>
                        <button class="clay-btn" onclick="selectAge('grandma')">兔奶奶</button>
                    </div>
                    <div id="hay-info" style="font-size:16px; color:#5d4037; font-weight:bold;"></div>
                `;
                window.selectAge = (age) => {
                    let info = '';
                    if (age === 'baby') info = '100% 苜蓿草：高蛋白質、高鈣質適合成長中的兔寶';
                    if (age === 'adult') info = '80% 提摩西草 + 20% 苜蓿草：多吃提摩西有助磨牙與排毛';
                    if (age === 'grandma') info = '100% 苜蓿草：奶奶牙口不好，愛吃什麼給什麼 ❤️';
                    document.getElementById('hay-info').innerText = info;
                    setTimeout(() => {
                        container.classList.remove('active');
                        openPolaroid(rewardMedia);
                    }, 2000);
                };

            } else if (gameType === 'bedding') {
                container.innerHTML = `
                    <div class="game-title">🛏️ 攻擊棉被！</div>
                    <p>快速連擊棉被，幫小比開洞！</p>
                    <div id="blanket" style="width:200px; height:120px; background:#ffcc80; border:4px dashed #e65100; margin:20px auto; border-radius:12px; display:flex; justify-content:center; align-items:center; cursor:pointer; font-weight:bold;">點擊挖棉被！</div>
                `;
                let clicks = 0;
                document.getElementById('blanket').onclick = () => {
                    clicks++;
                    if (clicks >= 5) {
                        container.classList.remove('active');
                        openPolaroid(rewardMedia);
                    }
                };

            } else if (gameType === 'litter') {
                container.innerHTML = `
                    <div class="game-title">🚽 用便盆的好兔寶</div>
                    <p>避開障礙物，讓小比跑到綠色便盆上尿尿！</p>
                    <button class="clay-btn" style="margin-top:20px;" onclick="finishLitter()">衝向便盆！</button>
                `;
                window.finishLitter = () => {
                    container.classList.remove('active');
                    openPolaroid(rewardMedia);
                };

            } else if (gameType === 'binky') {
                let count = 0;
                container.innerHTML = `
                    <div class="game-title">🏃 奔跑吧!小兔!</div>
                    <p>限時快速連擊，讓小比做出爆衝 + Binky 空中轉圈！</p>
                    <button class="clay-btn" id="binky-click-btn" style="margin:20px; font-size:22px;">爆衝轉圈！ (<span id="b-cnt">0</span>)</button>
                `;
                document.getElementById('binky-click-btn').onclick = () => {
                    count++;
                    document.getElementById('b-cnt').innerText = count;
                };
                setTimeout(() => {
                    container.classList.remove('active');
                    openPolaroid(rewardMedia);
                }, 4000);
            }
        }

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('intro-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-overlay').style.visibility = 'hidden';
                render();
            }, 800);
        };
    });
</script>
</body>
</html>
